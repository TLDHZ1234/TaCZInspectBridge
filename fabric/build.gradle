plugins {
    id 'java'
    id 'fabric-loom' version '1.9.1'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-${minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        // Shared, loader independent sources (api + mixins) live in ../common
        java.srcDir rootProject.file('common/src/main/java')
    }
}

loom {
    mixin {
        defaultRefmapName = "${mod_id}-refmap.json"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    def modsDir = "../mods/Fabric"
    modImplementation files("${modsDir}/TACZ-Refabricated-1.21.1-0.7.0-forge1.1.8-hotfix.jar")
    modImplementation files("${modsDir}/lrtactical-1.21.1-0.4.1.jar")
    modImplementation files("${modsDir}/ForgeConfigAPIPort-v21.1.6-1.21.1-Fabric.jar")
    modImplementation files("${modsDir}/player-animation-lib-fabric-2.0.4+1.21.1.jar")
    modImplementation files("${modsDir}/fabric-language-kotlin-1.14.2+kotlin.2.4.21.jar")
    modImplementation files("${modsDir}/keybindfixplus-2.0.0.jar")
    modImplementation files("${modsDir}/cardinal-components-base-6.1.3.jar")
    modImplementation files("${modsDir}/cardinal-components-entity-6.1.3.jar")
    modImplementation files("${modsDir}/simplebedrockmodel-fabric-2.3.0.1+mc1.21.1.jar")

    implementation files("${modsDir}/core-3.8.0.jar")
    implementation files("${modsDir}/toml-3.8.0.jar")
    implementation files("${modsDir}/luaj-core-3.0.8-figura.jar")
    implementation files("${modsDir}/luaj-jse-3.0.8-figura.jar")
    implementation files("${modsDir}/commons-math3-3.6.1.jar")
    implementation files("${modsDir}/bcel-6.6.1.jar")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
