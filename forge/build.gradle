plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-forge-${forge_minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    main {
        // Shared, loader independent sources (api + mixins) live in ../common
        java.srcDir rootProject.file('common/src/main/java')
    }
}

minecraft {
    mappings channel: 'parchment', version: project.forge_parchment_mappings
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

mixin {
    // Generates ${mod_id}-refmap.json, which the mixin config references.
    add sourceSets.main, "${mod_id}-refmap.json"
}

// Forge 1.20.1 discovers mixin configs through the jar manifest (the
// [[mixins]] table in mods.toml is only understood by NeoForge).
jar {
    manifest {
        attributes('MixinConfigs': 'taczinspect.mixins.json')
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Everything in mods/Forge (TaCZ, LRTactical, ...) is deobfuscated and used for compilation.
    def forgeModsDir = file("../mods/Forge")
    if (forgeModsDir.exists()) {
        forgeModsDir.listFiles({ file -> file.name.endsWith('.jar') } as FileFilter).each { file ->
            implementation fg.deobf(files(file))
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: forge_minecraft_version, minecraft_version_range: '[1.20.1,1.21)',
            forge_version: forge_version, forge_version_range: '[47,)',
            loader_version_range: '[47,)', mod_id: mod_id, mod_name: mod_name,
            mod_license: 'MIT', mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties + [project: project] }
}
