name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.loader }} (MC ${{ matrix.minecraft }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ForgeGradle 6 needs to run on JDK 17 for the 1.20.1 toolchain.
          - loader: forge
            minecraft: 1.20.1
            java: 17
          - loader: fabric
            minecraft: 1.21.1
            java: 21
          - loader: neoforge
            minecraft: 1.21.1
            java: 21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew -Pmodule=${{ matrix.loader }} :${{ matrix.loader }}:build --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaCZInspect-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: |
            ${{ matrix.loader }}/build/libs/*.jar
            !${{ matrix.loader }}/build/libs/*-sources.jar
            !${{ matrix.loader }}/build/libs/*-dev.jar
            !${{ matrix.loader }}/build/libs/*-slim.jar
          if-no-files-found: error
